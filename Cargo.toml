[package]
name = "lets-build-sentence"
version = "0.1.0"
edition = "2021"
description = "在线造句练习"
publish = false

[dependencies]
dioxus = { version = "=0.7.9", features = ["web"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = [
    "CssStyleDeclaration",
    "Document",
    "DomRect",
    "Element",
    "Event",
    "EventTarget",
    "HtmlElement",
    "HtmlInputElement",
    "InputEvent",
    "History",
    "KeyboardEvent",
    "Location",
    "Node",
    "Storage",
    "Window",
] }

[profile.wasm-dev]
inherits = "dev"
opt-level = 1

[profile.server-dev]
inherits = "dev"

[profile.android-dev]
inherits = "dev"

[package]
name = "lets-build-sentence"
version = "0.1.0"
edition = "2021"
description = "在线造句练习"
publish = false

[features]
default = ["web"]
web = ["dioxus/web"]
desktop = ["dioxus/desktop"]
mobile = ["dioxus/mobile"]

[dependencies]
dioxus = { version = "=0.7.9" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.wasm-dev]
inherits = "dev"
opt-level = 1

[profile.server-dev]
inherits = "dev"

[profile.android-dev]
inherits = "dev"
